        <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch profile info
            fetch('profile.php')
                .then(function(response) {
                    if (!response.ok) throw new Error('Not logged in or error fetching profile');
                    return response.json();
                })
                .then(function(data) {
                    document.getElementById('profileName').textContent = data.name || '-';
                    document.getElementById('profileEmail').textContent = data.email || '-';
                    document.getElementById('profilePhone').textContent = data.phone || '-';
                })
                .catch(function(err) {
                    document.getElementById('profileName').textContent = 'Not logged in';
                    document.getElementById('profileEmail').textContent = '-';
                    document.getElementById('profilePhone').textContent = '-';
                });

            // Password change logic (real data)
            var editBtn = document.querySelector('.profile-edit-btn');
            var changeSection = document.getElementById('changePasswordSection');
            var form = document.getElementById('changePasswordForm');
            var cancelBtn = document.getElementById('cancelChangePassword');
            var msg = document.getElementById('passwordChangeMsg');
            if (editBtn && changeSection && form && cancelBtn) {
                editBtn.addEventListener('click', function() {
                    changeSection.style.display = 'block';
                    editBtn.style.display = 'none';
                });
                cancelBtn.addEventListener('click', function() {
                    changeSection.style.display = 'none';
                    editBtn.style.display = '';
                    form.reset();
                    msg.textContent = '';
                });
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    msg.textContent = '';
                    var current = document.getElementById('currentPassword').value;
                    var newPass = document.getElementById('newPassword').value;
                    if (newPass.length < 6) {
                        msg.textContent = 'New password must be at least 6 characters.';
                        return;
                    }
                    var formData = new FormData();
                    formData.append('currentPassword', current);
                    formData.append('newPassword', newPass);
                    fetch('profile.php', {
                        method: 'POST',
                        body: formData
                    })
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(data) {
                        if (data.success) {
                            msg.style.color = '#2563eb';
                            msg.textContent = 'Password changed successfully!';
                            setTimeout(function() {
                                changeSection.style.display = 'none';
                                editBtn.style.display = '';
                                form.reset();
                                msg.textContent = '';
                            }, 1500);
                        } else {
                            msg.style.color = '#c00';
                            msg.textContent = data.error || 'Error changing password.';
                        }
                    })
                    .catch(function() {
                        msg.style.color = '#c00';
                        msg.textContent = 'Error changing password.';
                    });
                });
            }

            // Logout button logic
            var logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    // Optionally, destroy session via PHP
                    fetch('logout.php', { method: 'POST' })
                        .then(function() {
                            window.location.href = 'index.html';
                        })
                        .catch(function() {
                            window.location.href = 'index.html';
                        });
                });
            }
        });
        </script>
